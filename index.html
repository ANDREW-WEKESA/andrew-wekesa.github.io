<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andrew Wekesa — Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green:       #00ff88;
  --green-dim:   #00cc66;
  --green-faint: rgba(0,255,136,0.07);
  --green-glow:  rgba(0,255,136,0.18);
  --green-glow2: rgba(0,255,136,0.35);
  --blue:        #58a6ff;
  --yellow:      #ffd700;
  --red:         #ff5555;
  --cyan:        #00e5ff;
  --purple:      #c792ea;
  --white:       #e6edf3;
  --muted:       #4a5568;
  --muted2:      #718096;
  --bg:          #060a06;
  --bg2:         #0a0f0a;
  --bg3:         #0d140d;
  --border:      #162216;
  --border2:     #1e2e1e;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--green);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13.5px;
  line-height: 1.65;
  overflow: hidden;
}

/* ── Animated background grid ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
  animation: gridPulse 8s ease-in-out infinite;
}

@keyframes gridPulse {
  0%,100% { opacity: 0.6; }
  50%      { opacity: 1; }
}

/* ── CRT scanlines ── */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(0,0,0,0.06) 3px,
    rgba(0,0,0,0.06) 4px
  );
  pointer-events: none;
  z-index: 200;
}

/* ── Vignette ── */
#vignette {
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.85) 100%);
  pointer-events: none;
  z-index: 201;
}

/* ── Ambient glow orbs ── */
#orb1, #orb2 {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
  filter: blur(80px);
  opacity: 0.06;
}
#orb1 {
  width: 500px; height: 500px;
  background: var(--green);
  top: -150px; left: -150px;
  animation: orbFloat1 12s ease-in-out infinite;
}
#orb2 {
  width: 400px; height: 400px;
  background: var(--cyan);
  bottom: -100px; right: -100px;
  animation: orbFloat2 15s ease-in-out infinite;
}
@keyframes orbFloat1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(60px,40px)} }
@keyframes orbFloat2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-40px,-60px)} }

/* ── Wrapper ── */
#terminal-wrapper {
  position: relative;
  z-index: 10;
  width: 100%;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Title bar ── */
#titlebar {
  background: linear-gradient(180deg, #0f160f 0%, #0a0f0a 100%);
  border-bottom: 1px solid var(--border2);
  padding: 10px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  box-shadow: 0 1px 0 rgba(0,255,136,0.06), 0 4px 20px rgba(0,0,0,0.4);
}

.dots { display: flex; gap: 7px; align-items: center; }
.dot { width: 13px; height: 13px; border-radius: 50%; cursor: default; transition: filter 0.2s; }
.dot:hover { filter: brightness(1.3); }
.dot.red    { background: #ff5f57; box-shadow: 0 0 6px #ff5f5766; }
.dot.yellow { background: #ffbd2e; box-shadow: 0 0 6px #ffbd2e66; }
.dot.green  { background: #28c840; box-shadow: 0 0 6px #28c84066; }

#titlebar-center {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

#titlebar-text {
  font-size: 11.5px;
  color: var(--muted2);
  letter-spacing: 0.06em;
}

.tb-badge {
  font-size: 10px;
  padding: 2px 8px;
  border: 1px solid var(--border2);
  border-radius: 20px;
  color: var(--muted2);
  letter-spacing: 0.05em;
}

#titlebar-right {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.04em;
  min-width: 80px;
  text-align: right;
}

/* ── Output ── */
#output {
  flex: 1;
  overflow-y: auto;
  padding: 22px 28px 10px;
  scroll-behavior: smooth;
  position: relative;
  z-index: 10;
}

#output::-webkit-scrollbar { width: 3px; }
#output::-webkit-scrollbar-track { background: transparent; }
#output::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
#output::-webkit-scrollbar-thumb:hover { background: var(--green-dim); }

/* ── Input area ── */
#input-area {
  display: flex;
  align-items: center;
  padding: 11px 28px 15px;
  flex-shrink: 0;
  border-top: 1px solid var(--border2);
  background: linear-gradient(0deg, var(--bg2) 0%, var(--bg) 100%);
  box-shadow: 0 -1px 0 rgba(0,255,136,0.08), inset 0 1px 0 rgba(0,255,136,0.04);
  position: relative;
  z-index: 10;
}

#prompt-label {
  white-space: nowrap;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 0;
}
.pl-user   { color: var(--green); font-weight: 500; }
.pl-at     { color: var(--muted); }
.pl-host   { color: var(--cyan); font-weight: 500; }
.pl-sep    { color: var(--muted); }
.pl-path   { color: var(--blue); }
.pl-dollar { color: var(--green); margin-right: 10px; font-weight: 700; }

#cmd-input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--white);
  font-family: inherit;
  font-size: 13.5px;
  caret-color: var(--green);
  letter-spacing: 0.01em;
}

/* ── Lines ── */
.line { margin: 1.5px 0; white-space: pre-wrap; word-break: break-word; }
.line.prompt {
  color: var(--green);
  display: flex;
  gap: 0;
  align-items: flex-start;
  margin: 3px 0;
}
.line.prompt .p-label { white-space: nowrap; }
.line.prompt .cmd-text { color: var(--white); margin-left: 10px; }
.line.empty  { height: 8px; }
.line.output { color: #5a8a6a; }
.line.error  { color: var(--red); }
.line.info   { color: var(--cyan); }
.line.accent { color: var(--yellow); }
.line.white  { color: var(--white); }
.line.muted  { color: var(--muted2); font-size: 12px; }
.line.green  { color: var(--green); }
.line.purple { color: var(--purple); }
.line.dim    { color: #2a4a2a; }

/* ── Divider ── */
.divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border2) 20%, var(--border2) 80%, transparent);
  margin: 6px 0;
}

/* ── Boot animation ── */
@keyframes slideIn {
  from { opacity: 0; transform: translateX(-6px); }
  to   { opacity: 1; transform: translateX(0); }
}
.boot-line {
  animation: slideIn 0.18s ease forwards;
  opacity: 0;
}

/* ── Typing effect ── */
@keyframes typeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

/* ── Project cards ── */
.project-card {
  border: 1px solid var(--border2);
  border-left: 3px solid var(--green);
  padding: 12px 16px;
  margin: 5px 0;
  background: var(--green-faint);
  border-radius: 0 6px 6px 0;
  position: relative;
  overflow: hidden;
  transition: border-color 0.2s, background 0.2s;
}
.project-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(0,255,136,0.04) 0%, transparent 60%);
  pointer-events: none;
}
.project-card:hover {
  border-color: var(--border2);
  border-left-color: var(--cyan);
  background: rgba(0,229,255,0.05);
}
.p-header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.p-title  { color: var(--yellow); font-weight: 700; font-size: 13px; }
.p-status {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 20px;
  border: 1px solid;
  font-weight: 500;
  letter-spacing: 0.05em;
}
.p-tech { color: var(--cyan); font-size: 11.5px; margin-top: 4px; opacity: 0.85; }
.p-desc { color: var(--white); font-size: 12px; margin-top: 5px; opacity: 0.8; line-height: 1.5; }
.p-link {
  color: var(--green-dim);
  font-size: 11.5px;
  margin-top: 6px;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: color 0.2s;
}
.p-link:hover { color: var(--green); text-decoration: underline; }

/* ── Skill bars ── */
.skills-section { margin: 4px 0; }
.skill-row { display: flex; align-items: center; gap: 12px; margin: 5px 0; }
.skill-name { width: 130px; color: var(--white); font-size: 12px; flex-shrink: 0; }
.skill-track {
  flex: 1;
  height: 5px;
  background: var(--border2);
  border-radius: 10px;
  overflow: hidden;
  position: relative;
}
.skill-fill {
  height: 100%;
  border-radius: 10px;
  width: 0%;
  transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}
.skill-fill::after {
  content: '';
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 20px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3));
  border-radius: 10px;
}
.skill-pct { font-size: 11px; color: var(--muted2); min-width: 32px; text-align: right; }

/* ── Tag cloud ── */
.tag-cloud { display: flex; flex-wrap: wrap; gap: 7px; margin: 6px 0; }
.tag {
  padding: 3px 11px;
  border: 1px solid var(--border2);
  border-radius: 20px;
  font-size: 11.5px;
  transition: border-color 0.2s, color 0.2s;
  cursor: default;
}
.tag:hover { border-color: var(--green-dim); color: var(--green); }
.tag.green  { color: var(--green-dim);  border-color: rgba(0,204,102,0.3); }
.tag.cyan   { color: var(--cyan);       border-color: rgba(0,229,255,0.3); }
.tag.yellow { color: var(--yellow);     border-color: rgba(255,215,0,0.3); }
.tag.purple { color: var(--purple);     border-color: rgba(199,146,234,0.3); }
.tag.blue   { color: var(--blue);       border-color: rgba(88,166,255,0.3); }

/* ── Stat grid ── */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; margin: 6px 0; }
.stat-card {
  border: 1px solid var(--border2);
  border-radius: 6px;
  padding: 10px 14px;
  background: var(--green-faint);
  text-align: center;
}
.stat-val { font-size: 22px; font-weight: 700; color: var(--green); line-height: 1.2; }
.stat-lbl { font-size: 10.5px; color: var(--muted2); margin-top: 2px; letter-spacing: 0.05em; }

/* ── Blinking cursor ── */
.cursor {
  display: inline-block;
  width: 7px; height: 13px;
  background: var(--green);
  animation: blink 1s step-end infinite;
  vertical-align: middle;
  margin-left: 1px;
  border-radius: 1px;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* ── Glitch text ── */
@keyframes glitch {
  0%   { text-shadow: 2px 0 var(--red), -2px 0 var(--cyan); }
  20%  { text-shadow: -2px 0 var(--red), 2px 0 var(--cyan); }
  40%  { text-shadow: 2px 0 var(--cyan), -2px 0 var(--red); }
  60%  { text-shadow: 0 0 transparent; }
  80%  { text-shadow: -2px 0 var(--cyan), 2px 0 var(--red); }
  100% { text-shadow: 2px 0 var(--red), -2px 0 var(--cyan); }
}
.glitch { animation: glitch 0.4s steps(1) 3; }

/* ── Scanline flash on boot ── */
@keyframes scanFlash {
  0%   { opacity: 0; }
  10%  { opacity: 0.15; }
  100% { opacity: 0; }
}
#scan-flash {
  position: fixed;
  inset: 0;
  background: linear-gradient(180deg, transparent 0%, var(--green) 50%, transparent 100%);
  pointer-events: none;
  z-index: 300;
  opacity: 0;
  animation: scanFlash 1.2s ease-out forwards;
}

/* ── Mobile ── */
@media (max-width: 600px) {
  html { font-size: 12px; }
  #output { padding: 14px 14px 8px; }
  #input-area { padding: 9px 14px 13px; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<div id="scan-flash"></div>
<div id="vignette"></div>
<div id="orb1"></div>
<div id="orb2"></div>

<div id="terminal-wrapper">
  <div id="titlebar">
    <div class="dots">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
    </div>
    <div id="titlebar-center">
      <span id="titlebar-text">andrew@portfolio: ~</span>
      <span class="tb-badge">bash</span>
    </div>
    <div id="titlebar-right" id="tb-time"></div>
  </div>

  <div id="output"></div>

  <div id="input-area">
    <span id="prompt-label">
      <span class="pl-user">andrew</span><span class="pl-at">@</span><span class="pl-host">portfolio</span><span class="pl-sep">:</span><span class="pl-path" id="cwd">~</span><span class="pl-dollar"> $</span>
    </span>
    <input id="cmd-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" autofocus />
  </div>
</div>

<script>
const output   = document.getElementById('output');
const input    = document.getElementById('cmd-input');
const cwdEl    = document.getElementById('cwd');
const tbText   = document.getElementById('titlebar-text');
const tbRight  = document.getElementById('titlebar-right');

let currentDir = '~';
let cmdHistory = [];
let histIdx    = -1;

// ── Clock ──
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  if (tbRight) tbRight.textContent = `${h}:${m}:${s}`;
}
setInterval(updateClock, 1000);
updateClock();

// ── File system ──
const FS = {
  '~':                    ['about.txt','skills.txt','contact.txt','projects/','education/'],
  '~/projects':           ['taskflow/','hms/','portfolio/'],
  '~/projects/taskflow':  ['README.md','package.json','src/'],
  '~/projects/hms':       ['README.md','src/','public/'],
  '~/projects/portfolio': ['index.html','style.css'],
  '~/education':          ['kisii_university.txt','courses.txt'],
};

const FILE_CONTENTS = {
  'about.txt': `
  ┌─────────────────────────────────────────────┐

`,

`,

`,
  'README.md (hms)': `
  HMS — Hospital Management System
  ──────────────────────────────────

  Modules  : Patients, Appointments, AI Checker
             Analytics, Disease Library
  Status   : Active development
`,
};

const PROJECTS = [
  {
    title:  'TaskFlow — Project Management App',
    tech:   "Node.js · Express · MySQL · Africa's Talking · JWT",
    desc:   'Full-stack project management app with SMS authentication, JWT sessions, and real-time activity logging.',
    link:   'github.com/andrew-wekesa',
    status: 'In Dev',
    color:  'var(--yellow)',
  },
  {
    title:  'HMS — Hospital Management System',
    tech:   'React · Node.js · MySQL · Cloudflare Pages',
    desc:   'Hospital dashboard with patient management, appointments, AI symptom checker, and disease analytics.',
    link:   'c215c0fa.hms-frontend-gs6.pages.dev',
    status: 'Active',
    color:  'var(--cyan)',
  },
  {
    title:  'Portfolio — Terminal CV',
    tech:   'HTML · CSS · Vanilla JS',
    desc:   'Personal portfolio with a dark terminal aesthetic. The one you are looking at right now.',
    link:   'andrew-wekesa.github.io',
    status: 'Live',
    color:  'var(--green)',
  },
];

// ── Helpers ──
function esc(t) {
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function print(html, cls = 'output', delayMs = 0) {
  const d = document.createElement('div');
  d.className = `line ${cls}`;
  d.innerHTML = html;
  if (delayMs) {
    d.style.animationDelay = delayMs + 'ms';
    d.classList.add('boot-line');
  }
  output.appendChild(d);
  output.scrollTop = output.scrollHeight;
  return d;
}

function blank(h = 8) {
  const d = document.createElement('div');
  d.className = 'line empty';
  d.style.height = h + 'px';
  output.appendChild(d);
}

function hr() {
  const d = document.createElement('div');
  d.className = 'divider';
  output.appendChild(d);
}

function printPrompt(cmd) {
  const d = document.createElement('div');
  d.className = 'line prompt';
  d.innerHTML = `<span class="p-label"><span class="pl-user">andrew</span><span class="pl-at">@</span><span class="pl-host">portfolio</span><span class="pl-sep">:</span><span class="pl-path">${esc(currentDir)}</span><span class="pl-dollar"> $</span></span><span class="cmd-text">${esc(cmd)}</span>`;
  output.appendChild(d);
  output.scrollTop = output.scrollHeight;
}

function updateCwd() {
  cwdEl.textContent = currentDir;
  tbText.textContent = `andrew@portfolio: ${currentDir}`;
}

// ── Commands ──
const COMMANDS = {
  help:     cmdHelp,
  whoami:   cmdWhoami,
  ls:       cmdLs,
  cat:      cmdCat,
  cd:       cmdCd,
  pwd:      cmdPwd,
  projects: cmdProjects,
  skills:   cmdSkills,
  contact:  cmdContact,
  github:   cmdGithub,
  neofetch: cmdNeofetch,

  clear:    () => { output.innerHTML = ''; },
  date:     () => print(new Date().toLocaleString('en-KE', {timeZone:'Africa/Nairobi', hour12:false}), 'info'),
  echo:     (a) => print(esc(a.join(' ')), 'white'),
  history:  cmdHistoryCmd,
  exit:     () => print(`exit: Nice try. You can't leave the matrix. 😄`, 'error'),
  sudo:     () => print('sudo: andrew is not in the sudoers file. This incident will be reported.', 'error'),
  rm:       (a) => {
    if (a.includes('-rf')) print('Nice try. The portfolio stays. 🛡️', 'error');
    else print('rm: permission denied', 'error');
  },
  uname:    () => print('Linux portfolio 5.15.0-1 #1 SMP x86_64 GNU/Linux', 'output'),
  man:      (a) => {
    if (!a[0]) { print('What manual page do you want?', 'error'); return; }
    if (COMMANDS[a[0]]) print(`${a[0]}: built-in command. Type <span style="color:var(--green)">help</span> for usage.`, 'info');
    else print(`No manual entry for ${esc(a[0])}`, 'error');
  },
};
</script>

<script>
function cmdHelp() {
  blank();
  print(`  <span style="color:var(--yellow);font-weight:700">┌─ COMMANDS ──────────────────────────────────────────┐</span>`);
  blank(4);
  const cols = [
    [['whoami','Who is Andrew?'],       ['projects','All projects with details']],
    [['skills','Visual skills chart'],  ['contact','Contact & links']],
    [['ls [path]','List directory'],    ['cat [file]','Read a file']],
    [['cd [dir]','Change directory'],   ['pwd','Print working directory']],
    [['stats','Quick stats overview'],  ['neofetch','System info']],

function cmdLs(args) {
  let target = args[0] ? args[0].replace(/\/$/, '') : currentDir;
  if (target === '.') target = currentDir;
  const aliases = { 'projects':'~/projects', './projects':'~/projects', 'education':'~/education', './education':'~/education' };
  if (aliases[target]) target = aliases[target];
  else if (!target.startsWith('~')) target = currentDir + '/' + target;
  target = target.replace(/\/\//g, '/');

  const entries = FS[target];
  if (!entries) { print(`ls: cannot access '<span style="color:var(--yellow)">${esc(args[0]||'.')}</span>': No such file or directory`, 'error'); return; }

  let out = '';
  entries.filter(e => e.endsWith('/')).forEach(d => {
    out += `<span style="color:var(--blue);font-weight:600">${d}</span>  `;
  });
  entries.filter(e => !e.endsWith('/')).forEach(f => {
    const ext = f.split('.').pop();
    const color = ext === 'md' ? 'var(--cyan)' : ext === 'json' ? 'var(--yellow)' : ext === 'html' || ext === 'css' ? 'var(--purple)' : 'var(--green)';
    out += `<span style="color:${color}">${f}</span>  `;
  });
  blank(4);
  print(out || '(empty)');
  blank(4);
}

function cmdCat(args) {
  if (!args[0]) { print('cat: missing operand', 'error'); return; }
  let content = FILE_CONTENTS[args[0]];
  if (!content && args[0] === 'README.md') {
    if (currentDir.includes('taskflow')) content = FILE_CONTENTS['README.md (taskflow)'];
    else if (currentDir.includes('hms'))  content = FILE_CONTENTS['README.md (hms)'];
  }
  if (!content) { print(`cat: <span style="color:var(--yellow)">${esc(args[0])}</span>: No such file or directory`, 'error'); return; }
  blank(4);
  content.trim().split('\n').forEach(l => {
    const cls = (l.includes('┌') || l.includes('┐') || l.includes('└') || l.includes('┘') || l.includes('│')) ? 'accent'
              : l.includes('──') ? 'muted'
              : l.trim().startsWith('✦') ? 'green'
              : 'white';
    print(esc(l), cls);
  });
  blank();
}

function cmdCd(args) {
  if (!args[0] || args[0] === '~') { currentDir = '~'; updateCwd(); return; }
  const t = args[0].replace(/\/$/, '');
  if (t === '..') { currentDir = goUp(); updateCwd(); return; }
  const map = {
    'projects': '~/projects', './projects': '~/projects',
    'education': '~/education', './education': '~/education',
    'taskflow': currentDir.includes('projects') ? '~/projects/taskflow' : null,
    'hms':      currentDir.includes('projects') ? '~/projects/hms'      : null,
    'portfolio':currentDir.includes('projects') ? '~/projects/portfolio': null,
  };
  const resolved = map[t] || (t.startsWith('~/') ? t : null);
  if (resolved && FS[resolved]) { currentDir = resolved; updateCwd(); }
  else print(`cd: <span style="color:var(--yellow)">${esc(args[0])}</span>: No such file or directory`, 'error');
}

function goUp() {

// ── Run ──
function run(cmd) {
  cmd = cmd.trim();
  if (!cmd) return;
  cmdHistory.unshift(cmd);
  histIdx = -1;
  printPrompt(cmd);
  const parts = cmd.split(/\s+/);
  const name  = parts[0].toLowerCase();
  const args  = parts.slice(1);
  if (COMMANDS[name]) COMMANDS[name](args);
  else print(`  bash: <span style="color:var(--yellow)">${esc(name)}</span>: command not found — type <span style="color:var(--green)">help</span> for available commands`, 'error');
  blank(4);
}

// ── Input ──
input.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const v = input.value; input.value = ''; run(v);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (histIdx < cmdHistory.length - 1) histIdx++;
    input.value = cmdHistory[histIdx] || '';
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (histIdx > 0) histIdx--;
    else { histIdx = -1; input.value = ''; return; }
    input.value = cmdHistory[histIdx] || '';
  } else if (e.key === 'Tab') {
    e.preventDefault();
    const parts = input.value.split(' ');
    const partial = parts[parts.length - 1];
    if (parts.length === 1) {
      const match = Object.keys(COMMANDS).find(c => c.startsWith(partial));
      if (match) input.value = match;
    }
  } else if (e.key === 'l' && e.ctrlKey) {
    e.preventDefault(); output.innerHTML = '';
  } else if (e.key === 'c' && e.ctrlKey) {
    e.preventDefault();
    printPrompt(input.value + '^C');
    input.value = '';
    blank(4);
  }
});

document.getElementById('terminal-wrapper').addEventListener('click', () => input.focus());
